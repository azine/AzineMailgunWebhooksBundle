name: Publish 5.0.3

on:
  push:
    branches: [release/publish-5.0.3]
    paths: ['.github/workflows/publish-5.0.3.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish annotated 5.0.3 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cat-file -e 89c8fc2e3e13115aa18aa7ff0cd9206daf23c2da^{commit}
          git tag -a 5.0.3 89c8fc2e3e13115aa18aa7ff0cd9206daf23c2da -m 'PHP 8.5 explicit nullable association compatibility release'
          git push origin 5.0.3
