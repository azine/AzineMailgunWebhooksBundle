name: Publish Mailgun Webhooks 5.0.1

on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-5.0.1.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Tag validated merge commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a 5.0.1 8d1ce9fd59b1ac3a3a893174e90ccf530787bee9 -m 'PHP 8.5 / Symfony 7.4 release'
          git push origin 5.0.1
