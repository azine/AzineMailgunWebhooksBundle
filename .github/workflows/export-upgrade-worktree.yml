name: Export upgrade worktree

on:
  push:
    branches:
      - codex/fix-all-phpunit-tests

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mailparse, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Export repository and installed dependencies
        uses: actions/upload-artifact@v4
        with:
          name: mailgun-upgrade-worktree
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
