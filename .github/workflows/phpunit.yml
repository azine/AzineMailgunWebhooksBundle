name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "PHP 8.5 / dependencies ${{ matrix.dependency-mode }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        dependency-mode: ['stable', 'lowest']

    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_NO_AUDIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mailparse, mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php85-${{ matrix.dependency-mode }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php85-${{ matrix.dependency-mode }}-

      - name: Install dependencies (stable)
        if: matrix.dependency-mode == 'stable'
        run: composer update --prefer-dist

      - name: Install dependencies (lowest)
        if: matrix.dependency-mode == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist

      - name: Lint PHP
        run: find src Tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit with diagnostics
        run: >-
          vendor/bin/phpunit -c phpunit.xml.dist
          --display-deprecations
          --display-phpunit-deprecations
          --display-phpunit-notices
          --display-notices
          --display-skipped
          --fail-on-deprecation
          --fail-on-phpunit-deprecation
          --fail-on-phpunit-notice
          --fail-on-notice
          --fail-on-skipped
