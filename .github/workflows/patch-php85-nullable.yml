name: Patch PHP 8.5 nullable entity setters

on:
  push:
    branches: [fix/php85-nullable-entity-setters]
    paths: ['.github/workflows/patch-php85-nullable.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/php85-nullable-entity-setters
          fetch-depth: 0
      - name: Make nullable entity associations explicit
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/public function setEvent(MailgunEvent $event = null)/public function setEvent(?MailgunEvent $event = null)/' src/Entity/MailgunCustomVariable.php src/Entity/MailgunAttachment.php
          php -l src/Entity/MailgunCustomVariable.php
          php -l src/Entity/MailgunAttachment.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Entity/MailgunCustomVariable.php src/Entity/MailgunAttachment.php
          git commit -m 'Make nullable Mailgun event setters explicit'
          git push origin HEAD:fix/php85-nullable-entity-setters
      # Trigger after workflow registration.
