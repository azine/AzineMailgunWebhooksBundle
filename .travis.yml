language: php
php:
- 8.5.12
env:
- DEPENDENCIES=stable
- DEPENDENCIES=lowest
cache:
  directories:
  - $HOME/.composer/cache
before_script:
- if [ "$DEPENDENCIES" = "lowest" ]; then composer update --prefer-lowest --prefer-stable -n; else composer update --prefer-dist -n; fi
script:
- vendor/bin/phpunit -c phpunit.xml.dist
